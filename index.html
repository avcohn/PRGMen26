<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>הגברים של מרינה | Prague 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

font-family:'Heebo',sans-serif;

background:#F7F5F0;

color:#1D2A44;

overflow-x:hidden;

}

a{
text-decoration:none;
color:inherit;
}

img{
display:block;
max-width:100%;
}

:root{

--navy:#173B6C;

--gold:#D5A740;

--cream:#F7F5F0;

--card:#FFFFFF;

--text:#23344E;

--muted:#6C7789;

--shadow:0 20px 60px rgba(0,0,0,.08);

--radius:28px;

}

nav{

position:fixed;

top:0;

left:0;

right:0;

height:72px;

display:flex;

justify-content:space-between;

align-items:center;

padding:0 28px;

z-index:100;

transition:.35s;

}

nav.scrolled{

background:rgba(255,255,255,.92);

backdrop-filter:blur(12px);

box-shadow:0 5px 25px rgba(0,0,0,.08);

}

.logo{

font-size:1.2rem;

font-weight:800;

color:white;

}

nav.scrolled .logo{

color:var(--navy);

}

.menu{

display:flex;

gap:20px;

}

.menu a{

font-weight:600;

color:white;

}

nav.scrolled .menu a{

color:var(--navy);

}

.hero{

height:100vh;

background:

linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55)),

url("https://images.unsplash.com/photo-1541849546-216549ae216d?auto=format&fit=crop&w=2200&q=90");

background-size:cover;

background-position:center;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

padding:20px;

}

.hero-content{

color:white;

max-width:800px;

}

.hero h2{

font-size:1.2rem;

letter-spacing:3px;

margin-bottom:20px;

opacity:.9;

}

.hero h1{

font-size:clamp(3rem,8vw,6rem);

font-weight:900;

line-height:1;

margin-bottom:20px;

}

.hero p{

font-size:1.2rem;

opacity:.95;

margin-bottom:40px;

}

.countdown{

display:flex;

justify-content:center;

gap:15px;

flex-wrap:wrap;

}

.box{

width:95px;

height:95px;

background:rgba(255,255,255,.18);

backdrop-filter:blur(12px);

border-radius:22px;

display:flex;

flex-direction:column;

justify-content:center;

}

.box span:first-child{

font-size:2rem;

font-weight:800;

}

.box span:last-child{

font-size:.9rem;

opacity:.8;

}

.scroll{

margin-top:45px;

display:inline-flex;

padding:15px 26px;

background:white;

color:var(--navy);

border-radius:999px;

font-weight:700;

}

main{

max-width:1200px;

margin:auto;

padding:80px 20px;

}

.placeholder{

background:white;

border-radius:var(--radius);

box-shadow:var(--shadow);

padding:60px;

text-align:center;

}

.placeholder h2{

font-size:2rem;

margin-bottom:15px;

color:var(--navy);

}

.placeholder p{

color:var(--muted);

line-height:1.8;

}

@media(max-width:700px){

.menu{

display:none;

}

.hero p{

font-size:1rem;

}

.box{

width:80px;

height:80px;

}

}

</style>

</head>

<body>

<nav id="nav">

<div class="logo">

🍺 הגברים של מרינה

</div>

<div class="menu">

<a href="#">מלון</a>

<a href="#">מסלול</a>

<a href="#">פראג</a>

</div>

</nav>

<section class="hero">

<div class="hero-content">

<h2>

WHAT HAPPENS IN PRAGUE...

</h2>

<h1>

PRAGUE 2026

</h1>

<p>

30.10–01.11.2026

</p>

<div class="countdown">

<div class="box">

<span id="days">0</span>

<span>ימים</span>

</div>

<div class="box">

<span id="hours">0</span>

<span>שעות</span>

</div>

<div class="box">

<span id="minutes">0</span>

<span>דקות</span>

</div>

</div>

<a class="scroll" href="#content">

התחל את המסע ↓

</a>

</div>

</section>

<main id="content">

<div class="placeholder">

<h2>

פראג מחכה לנו 🇨🇿

</h2>

<p>

זהו בסיס האתר החדש.

בשלב הבא ייכנס כאן כרטיס המלון היוקרתי ולאחריו כרטיסי הימים.

</p>

</div>

</main>

<script>

const target=new Date("2026-10-30T10:00:00");

function update(){

const now=new Date();

const diff=target-now;

if(diff<0)return;

document.getElementById("days").textContent=Math.floor(diff/86400000);

document.getElementById("hours").textContent=Math.floor(diff%86400000/3600000);

document.getElementById("minutes").textContent=Math.floor(diff%3600000/60000);

}

update();

setInterval(update,60000);

window.addEventListener("scroll",()=>{

document.getElementById("nav").classList.toggle("scrolled",window.scrollY>40);

});

</script>

</body>

</html>
