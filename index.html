<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff8ef">
<title>הגברים של מרינה | פראג 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fff8ef;--cream-deep:#f5e4ca;--paper:#fffdf9;
  --mahogany:#6f3523;--mahogany-soft:#8b4a2e;
  --amber:#d78b25;--amber-light:#f0b44f;--gold:#c99a45;
  --ink:#3b241a;--muted:#7b665a;--line:rgba(111,53,35,.16);
  --shadow:0 22px 60px rgba(87,48,28,.16);--radius:28px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;font-family:"Heebo",sans-serif;color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%,rgba(240,180,79,.18),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(201,154,69,.15),transparent 30%),
    linear-gradient(180deg,var(--cream),#fffaf5 60%,var(--cream-deep));
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;z-index:-1;
  background-image:radial-gradient(circle at 1px 1px,rgba(111,53,35,.25) 1px,transparent 0);
  background-size:24px 24px;
}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.progress{position:fixed;top:0;right:0;left:0;height:4px;z-index:999}
.progress span{
  display:block;width:0;height:100%;
  background:linear-gradient(90deg,var(--mahogany),var(--amber),var(--amber-light));
  box-shadow:0 0 16px rgba(215,139,37,.55)
}
.hero{
  position:relative;min-height:100svh;display:grid;place-items:center;
  padding:34px 20px 70px;overflow:hidden;isolation:isolate
}
.hero::before{
  content:"";position:absolute;inset:0;z-index:-3;
  background:
    linear-gradient(180deg,rgba(255,248,239,.16),rgba(255,248,239,.72) 64%,var(--cream) 100%),
    url("1.jpg") center/cover no-repeat;
  filter:saturate(.86) sepia(.08);transform:scale(1.02)
}
.hero::after{
  content:"";position:absolute;inset:auto -10% 0;height:34%;z-index:-2;
  background:linear-gradient(180deg,transparent,var(--cream))
}
.hero-glow{
  position:absolute;width:min(850px,90vw);height:min(620px,75vh);border-radius:50%;
  background:radial-gradient(circle,rgba(255,231,185,.9),rgba(255,231,185,.42) 40%,transparent 72%);
  filter:blur(32px);z-index:-1
}
.hero-inner{width:min(1100px,100%);text-align:center;margin:auto}
.logo-shell{display:grid;place-items:center;margin:0 auto 22px;min-height:290px}
.hero-logo{
  width:min(980px,94vw);max-height:58vh;object-fit:contain;margin:0 auto;
  filter:drop-shadow(0 24px 34px rgba(97,50,25,.22));
  animation:floatLogo 5.5s ease-in-out infinite
}
@keyframes floatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.trip-summary{
  width:min(850px,100%);margin:10px auto 0;display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;padding:12px;border:1px solid rgba(255,255,255,.82);border-radius:24px;
  background:rgba(255,253,249,.78);backdrop-filter:blur(16px);
  box-shadow:var(--shadow)
}
.summary-item{padding:14px 10px;border-left:1px solid var(--line)}
.summary-item:last-child{border-left:0}
.summary-item span{display:block;margin-bottom:3px;color:var(--muted);font-size:.83rem;font-weight:600}
.summary-item strong{color:var(--mahogany);font-size:1rem;font-weight:800}
.countdown-block{width:min(850px,100%);margin:28px auto 0}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;color:var(--mahogany-soft);
  font-weight:800;letter-spacing:.04em
}
.eyebrow::before,.eyebrow::after{content:"";width:34px;height:1px;background:var(--gold)}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px;direction:ltr}
.count-box{
  padding:18px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.86);
  background:rgba(255,253,249,.8);box-shadow:0 14px 32px rgba(83,46,25,.09);
  backdrop-filter:blur(14px)
}
.count-box strong{
  display:block;color:var(--mahogany);
  font:900 clamp(1.8rem,4vw,2.7rem)/1 "Frank Ruhl Libre",serif
}
.count-box span{display:block;margin-top:5px;color:var(--muted);font-size:.82rem;font-weight:700}
.hero-actions{margin-top:24px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{
  min-height:52px;padding:0 27px;border-radius:999px;display:inline-flex;
  align-items:center;justify-content:center;gap:8px;font-weight:800;transition:.25s ease
}
.btn-primary{
  color:#fff;background:linear-gradient(135deg,var(--mahogany),var(--amber));
  box-shadow:0 15px 30px rgba(111,53,35,.28)
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 20px 42px rgba(111,53,35,.35)}
.btn-secondary{
  color:var(--mahogany);border:1px solid var(--line);
  background:rgba(255,253,249,.84);box-shadow:0 10px 24px rgba(83,46,25,.08)
}
.stage-note{
  width:min(850px,calc(100% - 32px));margin:0 auto 70px;padding:26px;
  border-radius:var(--radius);background:rgba(255,253,249,.9);
  border:1px solid var(--line);box-shadow:var(--shadow);text-align:center
}
.stage-note h2{
  margin:0 0 8px;color:var(--mahogany);
  font:900 2rem/1.15 "Frank Ruhl Libre",serif
}
.stage-note p{margin:0;color:var(--muted)}
.reveal{opacity:0;transform:translateY(24px);transition:.7s ease}
.reveal.in{opacity:1;transform:none}
@media(max-width:700px){
  .hero{min-height:auto;padding:18px 14px 52px}
  .logo-shell{min-height:220px;margin-bottom:12px}
  .hero-logo{width:min(700px,100%);max-height:46vh}
  .trip-summary{grid-template-columns:1fr;padding:10px}
  .summary-item{border-left:0;border-bottom:1px solid var(--line);padding:12px 8px}
  .summary-item:last-child{border-bottom:0}
  .countdown{gap:8px}
  .count-box{padding:14px 5px;border-radius:16px}
  .count-box strong{font-size:1.65rem}
  .hero-actions{display:grid;grid-template-columns:1fr}
  .btn{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

<header class="hero" id="top">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="hero-inner">
    <div class="logo-shell">
      <img src="logo2.png" class="hero-logo" alt="הגברים של מרינה - פראג 2026">
    </div>

    <section class="trip-summary reveal" aria-label="פרטי הטיול">
      <div class="summary-item"><span>📍 יעד</span><strong>פראג, צ'כיה</strong></div>
      <div class="summary-item"><span>🏨 מלון</span><strong>Hilton Old Town</strong></div>
      <div class="summary-item"><span>📅 תאריכים</span><strong>30.10–01.11.2026</strong></div>
    </section>

    <section class="countdown-block reveal" aria-label="ספירה לאחור לטיול">
      <div class="eyebrow">הטיול מתחיל בעוד</div>
      <div class="countdown">
        <div class="count-box"><strong id="days">0</strong><span>ימים</span></div>
        <div class="count-box"><strong id="hours">0</strong><span>שעות</span></div>
        <div class="count-box"><strong id="mins">0</strong><span>דקות</span></div>
        <div class="count-box"><strong id="secs">0</strong><span>שניות</span></div>
      </div>
    </section>

    <div class="hero-actions reveal">
      <a href="#next-stage" class="btn btn-primary">🍺 יאללה מתחילים</a>
      <a href="#top" class="btn btn-secondary">פראג 2026</a>
    </div>
  </div>
</header>

<main>
  <section class="stage-note reveal" id="next-stage">
    <h2>שלב 1 מוכן</h2>
    <p>בשלב הבא נוסיף את שלושת כרטיסי הימים עם 1.jpg, 2.jpg ו־3.jpg.</p>
  </section>
</main>

<script>
const progressBar=document.getElementById("progressBar");
function updateProgress(){
  const page=document.documentElement;
  const maxScroll=page.scrollHeight-page.clientHeight;
  progressBar.style.width=(maxScroll>0?(window.scrollY/maxScroll)*100:0)+"%";
}
window.addEventListener("scroll",updateProgress,{passive:true});
updateProgress();

const revealItems=document.querySelectorAll(".reveal");
if("IntersectionObserver" in window){
  const observer=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add("in");
        observer.unobserve(entry.target);
      }
    });
  },{threshold:.12});
  revealItems.forEach(item=>observer.observe(item));
}else{
  revealItems.forEach(item=>item.classList.add("in"));
}

const targetDate=new Date("2026-10-30T08:35:00+01:00").getTime();
const daysEl=document.getElementById("days");
const hoursEl=document.getElementById("hours");
const minsEl=document.getElementById("mins");
const secsEl=document.getElementById("secs");

function updateCountdown(){
  const distance=targetDate-Date.now();
  if(distance<=0){
    daysEl.textContent=hoursEl.textContent=minsEl.textContent=secsEl.textContent="0";
    return;
  }
  daysEl.textContent=Math.floor(distance/86400000);
  hoursEl.textContent=Math.floor((distance%86400000)/3600000);
  minsEl.textContent=Math.floor((distance%3600000)/60000);
  secsEl.textContent=Math.floor((distance%60000)/1000);
}
updateCountdown();
setInterval(updateCountdown,1000);
</script>
</body>
</html>
